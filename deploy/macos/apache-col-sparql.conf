# Oxigraph SPARQL endpoint served through the existing iphylo.org Apache,
# with the git checkout itself acting as the web directory.
#
# Include this from the iphylo.org vhost, or paste it inside the <VirtualHost>.
# Apache already terminates TLS and is already externally reachable, so neither
# Caddy nor a Cloudflare tunnel is needed here.
#
# Assumes:
#   git clone https://github.com/rdmpage/catalogue-of-life-rdf.git ~/Sites/iphylo/col
#
# giving:
#   https://iphylo.org/col/        -> index.html at the repo root
#   https://iphylo.org/col/query   -> proxied to Oxigraph on 127.0.0.1:7878
#
# Change the /col prefix freely: index.html derives its endpoint from its own
# URL, so nothing in the HTML needs editing.
#
# Required modules. On macOS's bundled Apache these are commented out in
# /etc/apache2/httpd.conf by default; Homebrew's httpd.conf is at
# /opt/homebrew/etc/httpd/httpd.conf.
#
#   LoadModule proxy_module       libexec/apache2/mod_proxy.so
#   LoadModule proxy_http_module  libexec/apache2/mod_proxy_http.so
#   LoadModule headers_module     libexec/apache2/mod_headers.so
#   LoadModule rewrite_module     libexec/apache2/mod_rewrite.so

ProxyRequests Off

# ── The checkout ─────────────────────────────────────────────────────────────
#
# DEFAULT DENY. A git checkout in a web root contains a lot that must not be
# public, and an allow-list is the only version of this that stays safe as the
# repo grows. Denying item-by-item means every new file is public until someone
# remembers to block it.
#
# What this is protecting against, concretely:
#   .git/            full history, and the remote URL (credentials, if any)
#   *.php            these READ THE COLDP DUMP AND EMIT MILLIONS OF TRIPLES.
#                    If mod_php is active, fetching taxa.php would execute it.
#   2026-*_xr_coldp/ 5 GB of source data
#   *.nt             ~13 GB of generated RDF, over a home connection
#   oxigraph/        the RocksDB store, if built inside the checkout
#
<Directory "/Users/rpage/Sites/iphylo/col">
    Require all denied

    Options -Indexes -ExecCGI -FollowSymLinks
    AllowOverride None

    # Belt and braces: even if something below is ever opened up, no PHP in
    # this tree should ever be executed by the web server.
    <FilesMatch "\.php$">
        SetHandler none
        Require all denied
    </FilesMatch>

    # The only public file.
    <Files "index.html">
        Require all granted
    </Files>
</Directory>

DirectoryIndex index.html

# To publish compressed dumps later, create ~/Sites/iphylo/col/dumps and add:
#
#   <Directory "/Users/rpage/Sites/iphylo/col/dumps">
#       Require all granted
#       Options -Indexes
#   </Directory>
#
# Serve the .zst files, not the raw .nt — 13 GB uncompressed over a home
# connection is not something you want a crawler discovering.

# ── Write paths ──────────────────────────────────────────────────────────────
# serve-read-only refuses these at the engine too; blocking here keeps them off
# the backend entirely and returns a clearer error.
<LocationMatch "^/col/(update|store)">
    Require all denied
</LocationMatch>

# ── SPARQL query endpoint ────────────────────────────────────────────────────
<Location "/col/query">
    ProxyPass        "http://127.0.0.1:7878/query"
    ProxyPassReverse "http://127.0.0.1:7878/query"

    # CORS lives ONLY here. Do not also pass --cors to Oxigraph: two layers each
    # setting Access-Control-Allow-Origin makes browsers reject the response,
    # and the error gives no hint as to the cause.
    Header always set Access-Control-Allow-Origin  "*"
    Header always set Access-Control-Allow-Methods "GET, POST, OPTIONS"
    Header always set Access-Control-Allow-Headers "Content-Type, Accept"
    Header always set Access-Control-Max-Age       "86400"

    # Answer preflight here rather than forwarding it to Oxigraph.
    RewriteEngine On
    RewriteCond %{REQUEST_METHOD} =OPTIONS
    RewriteRule ^ - [R=204,L]

    <LimitExcept GET POST OPTIONS HEAD>
        Require all denied
    </LimitExcept>
</Location>

# How long Apache waits on Oxigraph. Note the caveat: this ends the *client's*
# wait, but Oxigraph 0.4.2 has no query timeout of its own and keeps evaluating
# until it notices the closed socket. A runaway query still burns CPU after the
# caller has gone. Nothing in Apache can fix that.
ProxyTimeout 90

# ── Not available here ───────────────────────────────────────────────────────
# Rate limiting. mod_ratelimit throttles bandwidth, not request rate; request
# limiting needs mod_qos or mod_evasive, neither of which ships with Apache.
