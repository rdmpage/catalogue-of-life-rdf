# Oxigraph SPARQL endpoint served through the existing iphylo.org Apache.
#
# Include this from the iphylo.org vhost, or paste it inside the <VirtualHost>.
# Apache already terminates TLS and is already externally reachable, so there is
# no need for Caddy or a Cloudflare tunnel on this host.
#
# Assumes:
#   - the landing page lives in ~/Sites/iphylo/col/  (served directly, no config)
#   - Oxigraph runs read-only on 127.0.0.1:7878      (see the launchd plist)
#   - the endpoint is therefore https://iphylo.org/col/query
#
# Change the /col prefix below if you want it somewhere else — but if you do,
# nothing else needs editing: site/index.html derives its endpoint from its own
# URL rather than assuming the site root.
#
# Required modules. On macOS's bundled Apache these are commented out in
# /etc/apache2/httpd.conf by default; Homebrew's httpd.conf is at
# /opt/homebrew/etc/httpd/httpd.conf.
#
#   LoadModule proxy_module       libexec/apache2/mod_proxy.so
#   LoadModule proxy_http_module  libexec/apache2/mod_proxy_http.so
#   LoadModule headers_module     libexec/apache2/mod_headers.so
#   LoadModule rewrite_module     libexec/apache2/mod_rewrite.so

# Never act as a forward proxy. This is the default, but an open forward proxy
# is bad enough that it is worth stating.
ProxyRequests Off

# ── Write paths ──────────────────────────────────────────────────────────────
# serve-read-only refuses these at the engine too; blocking here keeps them off
# the backend entirely and returns a clearer error.
<LocationMatch "^/col/(update|store)">
    Require all denied
</LocationMatch>

# ── SPARQL query endpoint ────────────────────────────────────────────────────
<Location "/col/query">
    ProxyPass        "http://127.0.0.1:7878/query"
    ProxyPassReverse "http://127.0.0.1:7878/query"

    # CORS lives ONLY here. Do not also pass --cors to Oxigraph: two layers each
    # setting Access-Control-Allow-Origin makes browsers reject the response,
    # and the error gives no hint as to the cause.
    Header always set Access-Control-Allow-Origin  "*"
    Header always set Access-Control-Allow-Methods "GET, POST, OPTIONS"
    Header always set Access-Control-Allow-Headers "Content-Type, Accept"
    Header always set Access-Control-Max-Age       "86400"

    # Answer preflight here rather than forwarding it to Oxigraph.
    RewriteEngine On
    RewriteCond %{REQUEST_METHOD} =OPTIONS
    RewriteRule ^ - [R=204,L]

    <LimitExcept GET POST OPTIONS HEAD>
        Require all denied
    </LimitExcept>
</Location>

# How long Apache waits on Oxigraph. Note the caveat: this ends the *client's*
# wait, but Oxigraph 0.4.2 has no query timeout of its own and keeps evaluating
# until it notices the closed socket. A runaway query still burns CPU after the
# caller has gone. Nothing in Apache can fix that.
ProxyTimeout 90

# ── Optional: keep crawlers off the endpoint ─────────────────────────────────
# A public SPARQL endpoint gets crawled. This stops well-behaved bots only.
#
#   Alias /robots.txt /Users/rpage/Sites/iphylo/robots.txt
#
# ── Optional: rate limiting ──────────────────────────────────────────────────
# Apache's mod_ratelimit throttles *bandwidth*, not request rate, so it is not
# what you want here. For request-rate limiting you need mod_qos or mod_evasive,
# neither of which ships with Apache. Given this is a proof of concept shown to
# a few people, going without is a reasonable call — just know it is absent.
