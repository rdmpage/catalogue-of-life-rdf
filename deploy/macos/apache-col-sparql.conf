# SPARQL endpoint: proxy /col/query to Oxigraph.
#
# Include this from INSIDE the iphylo.org <VirtualHost> blocks — note there are
# two, one for 0.0.0.0:80 and one for [::]:80, and it is needed in both:
#
#     Include /Users/rpage/Sites/iphylo/col/deploy/macos/apache-col-sparql.conf
#
# Requires these in /opt/homebrew/etc/httpd/httpd.conf (Homebrew's Apache is the
# one running; /usr/sbin/httpd is macOS's and is NOT in use):
#
#     LoadModule proxy_module      lib/httpd/modules/mod_proxy.so
#     LoadModule proxy_http_module lib/httpd/modules/mod_proxy_http.so
#
# mod_headers and mod_rewrite are already loaded on this host.
#
# ── Scope ────────────────────────────────────────────────────────────────────
# This file deals ONLY with the proxied URL. Protection of the checkout's real
# files — .git, the PHP generators, the .nt dumps — lives in the .htaccess at
# the repo root, because the vhost sets AllowOverride All.
#
# Do NOT add a <Directory> block here for the checkout. It would merge with the
# .htaccess and the two sets of Require rules fight, which 403s the landing page.
#
# <Location> matches a URL path, unlike <Directory> which matches a filesystem
# path. /col/query is not a file, so <Location> is the only container that can
# see it.

ProxyRequests Off

# ── Write paths ──────────────────────────────────────────────────────────────
# serve-read-only refuses these at the engine too; blocking here keeps them off
# the backend entirely and returns a clearer error.
<LocationMatch "^/col/(update|store)">
    Require all denied
</LocationMatch>

# ── SPARQL query endpoint ────────────────────────────────────────────────────
<Location "/col/query">
    Require all granted

    ProxyPass        "http://127.0.0.1:7878/query"
    ProxyPassReverse "http://127.0.0.1:7878/query"

    # CORS lives ONLY here. Do not also pass --cors to Oxigraph: two layers each
    # setting Access-Control-Allow-Origin makes browsers reject the response,
    # and the error gives no hint as to the cause.
    Header always set Access-Control-Allow-Origin  "*"
    Header always set Access-Control-Allow-Methods "GET, POST, OPTIONS"
    Header always set Access-Control-Allow-Headers "Content-Type, Accept"
    Header always set Access-Control-Max-Age       "86400"

    # Answer preflight here rather than forwarding it to Oxigraph.
    RewriteEngine On
    RewriteCond %{REQUEST_METHOD} =OPTIONS
    RewriteRule ^ - [R=204,L]

    <LimitExcept GET POST OPTIONS HEAD>
        Require all denied
    </LimitExcept>
</Location>

# How long Apache waits on Oxigraph.
#
# This is the single most important number for protecting the OTHER sites on
# this host. Apache runs mpm_prefork (mod_php requires it), so every in-flight
# SPARQL query holds an entire Apache process for the duration. Hold enough of
# them and MaxRequestWorkers is exhausted and iphylo.org, bionames.org and
# everything else stop being served — not crashed, just starved.
#
# 30s rather than 90s frees workers three times faster. It costs legitimate slow
# queries (a full scan takes ~23s, so this is close to the edge), but the whole
# point is that the SPARQL endpoint is expendable and the other sites are not.
#
# Caveat that no Apache setting can fix: this ends the *client's* wait, not
# Oxigraph's work. 0.4.2 has no query timeout and keeps evaluating until it
# notices the closed socket.
ProxyTimeout 30

# ── Not available here ───────────────────────────────────────────────────────
# Rate limiting. mod_ratelimit throttles bandwidth, not request rate; request
# limiting needs mod_qos or mod_evasive, neither of which ships with Apache.
